services:
  - type: web
    name: finn-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FINN_DATABASE_URL
        value: sqlite:///./data/finn.db
      - key: FINN_LLM_PROVIDER
        value: openai_compatible

  - type: web
    name: finn-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: FINN_BACKEND_URL
        value: http://finn-api:10000
